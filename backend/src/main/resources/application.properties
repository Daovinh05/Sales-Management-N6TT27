spring.datasource.url=jdbc:mysql://localhost:3307/banhang
spring.datasource.username=root
spring.datasource.password=banhang123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.application.name=sale-management

# CORS cho frontend Vite local (WebConfig đọc biến này, cách nhau bằng dấu phẩy)
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173}
# JWT: đọc từ biến môi trường, fallback secret dev khi chạy local
# Production: export APP_JWT_SECRET=$(openssl rand -base64 96) rồi chạy
app.jwt.secret=${APP_JWT_SECRET:dev-secret-key-day-du-128-byte-cho-hs512-0123456789-abcdef-XYZ-0123456789-abcdef-sale-management-2026}
app.jwt.expiration=1800000
app.jwt.refresh-expiration=604800000

# Upload ảnh biến thể (FileStorageService + WebConfig serve /uploads/**)
app.upload.dir=${APP_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Gửi mail đặt lại mật khẩu qua Gmail SMTP cố định
# Bắt buộc bật xác thực 2 bước cho Gmail rồi tạo App Password tại
# https://myaccount.google.com/apppasswords (KHÔNG dùng mật khẩu đăng nhập thường).
# Điền vào biến môi trường MAIL_USERNAME (gmail gửi) và MAIL_PASSWORD (app password 16 ký tự).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Địa chỉ hiển thị trong ô "From" (mặc định dùng luôn MAIL_USERNAME)
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
# Frontend để tạo returnUrl/cancelUrl cho PayOS (nguồn duy nhất vẫn là webhook)
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# PayOS: Client ID + API Key + Checksum Key lấy tại https://my.payos.vn
# sau khi tạo kênh thanh toán. Chạy local test webhook qua ngrok:
# ngrok http 8080 rồi dán https://<id>.ngrok-free.app/api/payments/payos-webhook
# vào mục Webhook URL trên dashboard PayOS.
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
