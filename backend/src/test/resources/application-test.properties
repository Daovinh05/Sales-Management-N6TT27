# Profile test: dùng H2 in-memory thay vì MySQL local.
# Kích hoạt bằng @ActiveProfiles("test") cho các test cần load full Spring context.
spring.datasource.url=jdbc:h2:mem:banhang-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Không chạy script khởi tạo dữ liệu production trong test.
spring.sql.init.mode=never
