openapi: 3.0.3
info:
  title: Sales Management Auth Password Reset API
  version: 1.0.0
paths:
  /api/auth/password/forgot:
    post:
      summary: Yêu cầu đặt lại mật khẩu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Yêu cầu được chấp nhận; nếu email hợp lệ sẽ gửi email reset.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Email không hợp lệ

  /api/auth/password/reset:
    post:
      summary: Xác nhận và cập nhật mật khẩu mới
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - newPassword
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                  minLength: 6
      responses:
        '200':
          description: Mật khẩu mới được cập nhật thành công.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Token không hợp lệ / hết hạn / mật khẩu không đảm bảo quy tắc.
        '404':
          description: Token không tồn tại hoặc không thuộc về tài khoản nào.
