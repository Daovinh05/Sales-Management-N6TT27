services:
  mysql:
    image: mysql:8.0
    container_name: sales-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sale_management
      MYSQL_ROOT_PASSWORD: anhthanhpro2005
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-panhthanhpro2005"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sales-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # Backend Spring Boot (bật lên sau khi có Dockerfile trong backend/)
