  #     SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/sale_management
  #     SPRING_DATASOURCE_USERNAME: root
  #     SPRING_DATASOURCE_PASSWORD: anhthanhpro2005
  #   depends_on:
  #     mysql:
  #       condition: service_healthy

  # Frontend React Vite (bật lên sau khi có Dockerfile trong frontend/)
