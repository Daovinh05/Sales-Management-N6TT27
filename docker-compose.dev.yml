services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    # Ép giờ Việt Nam kể cả khi chạy bản dev (mặc định image là UTC)
    environment:
      TZ: Asia/Ho_Chi_Minh
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Ho_Chi_Minh
    volumes:
      - ./backend:/app
      - maven-cache:/root/.m2

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    ports: !override
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.vite

volumes:
  maven-cache:
